<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YangMatch - Tìm căn hợp gu - YangHomestay</title>
  <link rel="canonical" href="https://yanghomestay.helioho.st/customer/yangmatch.html">
  <meta name="description" content="YangMatch gợi ý homestay tại Hà Nội dựa trên người đi cùng, phong cách, tiện nghi và ngân sách của bạn.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#1F2923">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <section class="section" id="app">
    <div class="container">
      <div class="text-center" style="margin-bottom:30px">
        <span class="eyebrow">YangMatch</span>
        <h1>Tìm căn hợp gu của bạn</h1>
        <p class="lead">Trả lời 4 câu hỏi nhanh — chúng tôi sẽ gợi ý những căn homestay phù hợp với cách bạn muốn trải nghiệm Hà Nội.</p>
      </div>

      <!-- QUIZ -->
      <div class="quiz-progress-wrap"><div class="quiz-progress-head"><span>YangMatch</span><strong id="quiz-progress-label">1 / 4</strong></div><div class="quiz-progress"><span id="quiz-progress-bar"></span></div></div>
      <div class="quiz-card form-card" id="quiz">
        <div class="quiz-step active" data-step="1">
          <h2>Bạn đi cùng ai?</h2>
          <div class="quiz-options" data-q="q1">
            <button type="button" class="quiz-option" aria-pressed="false" data-val="solo"><span class="quiz-symbol" aria-hidden="true">M</span>Một mình</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="couple"><span class="quiz-symbol" aria-hidden="true">C</span>Cặp đôi</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="friends"><span class="quiz-symbol" aria-hidden="true">N</span>Nhóm bạn</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="family"><span class="quiz-symbol" aria-hidden="true">G</span>Gia đình</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="business"><span class="quiz-symbol" aria-hidden="true">C</span>Công tác</button>
          </div>
        </div>

        <div class="quiz-step" data-step="2">
          <h2>Bạn thích phong cách nào?</h2>
          <div class="quiz-options" data-q="q2">
            <button type="button" class="quiz-option" aria-pressed="false" data-val="quiet"><span class="quiz-symbol" aria-hidden="true">Y</span>Yên tĩnh</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="romantic"><span class="quiz-symbol" aria-hidden="true">L</span>Lãng mạn</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="vintage"><span class="quiz-symbol" aria-hidden="true">V</span>Vintage Hà Nội</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="modern"><span class="quiz-symbol" aria-hidden="true">H</span>Hiện đại</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="vibrant"><span class="quiz-symbol" aria-hidden="true">S</span>Sôi động</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="nature"><span class="quiz-symbol" aria-hidden="true">T</span>Gần thiên nhiên</button>
          </div>
        </div>

        <div class="quiz-step" data-step="3">
          <h2>Tiện nghi nào quan trọng với bạn?</h2>
          <p class="form-hint" style="margin-bottom:12px">Chọn tất cả những gì bạn muốn.</p>
          <div class="quiz-options" data-q="q3" data-multi="1">
            <button type="button" class="quiz-option" aria-pressed="false" data-val="bathtub"><span class="quiz-symbol" aria-hidden="true">B</span>Bồn tắm</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="balcony"><span class="quiz-symbol" aria-hidden="true">B</span>Ban công</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="lake_view"><span class="quiz-symbol" aria-hidden="true">V</span>View hồ</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="kitchen"><span class="quiz-symbol" aria-hidden="true">B</span>Bếp</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="smart_tv"><span class="quiz-symbol" aria-hidden="true">S</span>Smart TV</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="workspace"><span class="quiz-symbol" aria-hidden="true">W</span>Bàn làm việc</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="washing_machine"><span class="quiz-symbol" aria-hidden="true">M</span>Máy giặt</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="elevator"><span class="quiz-symbol" aria-hidden="true">T</span>Thang máy</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="parking"><span class="quiz-symbol" aria-hidden="true">P</span>Chỗ đỗ xe</button>
          </div>
        </div>

        <div class="quiz-step" data-step="4">
          <h2>Ngân sách mỗi đêm của bạn?</h2>
          <div class="quiz-options" data-q="q4">
            <button type="button" class="quiz-option" aria-pressed="false" data-val="700000"><span class="quiz-symbol" aria-hidden="true">N</span>Dưới 700.000 ₫</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="1200000"><span class="quiz-symbol" aria-hidden="true">N</span>700.000 – 1.200.000 ₫</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="2000000"><span class="quiz-symbol" aria-hidden="true">N</span>1.200.000 – 2.000.000 ₫</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="2500000"><span class="quiz-symbol" aria-hidden="true">P</span>Trên 2.000.000 ₫</button>
            <button type="button" class="quiz-option" aria-pressed="false" data-val="0"><span class="quiz-symbol" aria-hidden="true">L</span>Không giới hạn</button>
          </div>
        </div>

        <div class="quiz-nav">
          <button type="button" class="btn btn-ghost hidden" id="q-prev">← Quay lại</button>
          <span></span>
          <button type="button" class="btn btn-primary hidden" id="q-next">Tiếp theo →</button>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="results" class="hidden"></div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      'use strict';
      var UI = window.YangUI;
      UI.injectHeader();
      UI.injectFooter();

      var step = 1;
      var answers = { q1: '', q2: '', q3: [], q4: 0 };
      var TOTAL_STEPS = 4;

      function showStep(n) {
        step = n;
        var pl = document.getElementById('quiz-progress-label');
        var pb = document.getElementById('quiz-progress-bar');
        if (pl) pl.textContent = step + ' / ' + TOTAL_STEPS;
        if (pb) pb.style.width = ((step / TOTAL_STEPS) * 100) + '%';
        document.querySelectorAll('.quiz-step').forEach(function (s) {
          s.classList.toggle('active', Number(s.getAttribute('data-step')) === step);
        });
        document.getElementById('q-prev').classList.toggle('hidden', step === 1);
        document.getElementById('q-next').classList.toggle('hidden', step === TOTAL_STEPS);
      }

      document.querySelectorAll('.quiz-options').forEach(function (group) {
        var q = group.getAttribute('data-q');
        var multi = group.getAttribute('data-multi') === '1';
        group.querySelectorAll('.quiz-option').forEach(function (opt) {
          opt.addEventListener('click', function () {
            var val = opt.getAttribute('data-val');
            if (multi) {
              opt.classList.toggle('selected');
              opt.setAttribute('aria-pressed', opt.classList.contains('selected') ? 'true' : 'false');
              var vals = Array.from(group.querySelectorAll('.quiz-option.selected')).map(function (x) { return x.getAttribute('data-val'); });
              answers[q] = vals;
            } else {
              group.querySelectorAll('.quiz-option').forEach(function (x) { x.classList.remove('selected'); x.setAttribute('aria-pressed', 'false'); });
              opt.classList.add('selected');
              opt.setAttribute('aria-pressed', 'true');
              answers[q] = val;
              setTimeout(function () {
                if (step < TOTAL_STEPS) showStep(step + 1);
                else submit();
              }, 250);
            }
          });
        });
      });

      document.getElementById('q-prev').addEventListener('click', function () { showStep(step - 1); });
      document.getElementById('q-next').addEventListener('click', function () {
        if (step < TOTAL_STEPS) showStep(step + 1);
        else submit();
      });

      function submit() {
        if (!answers.q1 || !answers.q2 || !answers.q4 && answers.q4 !== '0') {
          UI.toast('Vui lòng trả lời đầy đủ các câu hỏi', 'error');
          return;
        }
        var quiz = document.getElementById('quiz');
        var results = document.getElementById('results');
        quiz.classList.add('hidden');
        results.classList.remove('hidden');
        results.innerHTML = '<div class="state-box"><div class="skeleton" style="height:40px;max-width:300px;margin:0 auto 12px"></div><div class="skeleton" style="height:20px;max-width:220px;margin:0 auto"></div></div>';

        var body = {
          q1: answers.q1,
          q2: answers.q2,
          q3: Array.isArray(answers.q3) ? answers.q3 : [],
          q4: Number(answers.q4) || 0
        };

        window.YangAPI.post('yangmatch', body).then(function (j) {
          if (!j.success) {
            results.innerHTML = '<div class="state-box"><h3>' + UI.esc(j.message || 'Lỗi') + '</h3><button type="button" class="btn btn-primary" onclick="location.reload()">Thử lại</button></div>';
            return;
          }
          renderMatches(j.data);
        }).catch(function () {
          results.innerHTML = '<div class="state-box"><h3>Không kết nối được máy chủ</h3></div>';
        });
      }

      function renderMatches(data) {
        var matches = data.matches || [];
        var box = document.getElementById('results');
        if (!matches.length) {
          box.innerHTML = '<div class="state-box"><span class="emoji">🔍</span><h3>Chưa có căn phù hợp</h3><p>Hãy thử nới rộng ngân sách hoặc thay đổi lựa chọn.</p><button type="button" class="btn btn-primary" onclick="location.reload()">Làm lại</button></div>';
          return;
        }
        box.innerHTML = '<h2 class="text-center" style="margin-bottom:6px">3 căn hợp gu bạn nhất</h2>' +
          '<p class="text-center" style="color:var(--earth-light);margin-bottom:24px">Kết quả được xếp hạng theo lựa chọn của bạn; ngân sách có dung sai tối đa 20% để tránh gợi ý quá xa mức mong muốn.</p>' +
          '<div class="grid grid-3">' + matches.map(function (m) {
            var u = m.unit || {};
            var img = u.cover_image && u.cover_image.image_url
              ? window.assetUrl(u.cover_image.image_url)
              : window.assetUrl('assets/images/homestays/fallback/unit-fallback.jpg');
            var reasons = (m.reasons || []).map(function (r) { return '<li>✓ ' + UI.esc(r.text) + '</li>'; }).join('');
            return '<article class="card">' +
              '<div class="card-media"><img src="' + UI.esc(img) + '" alt="' + UI.esc(u.name) + '" loading="lazy" onerror="this.src=window.assetUrl(\'assets/images/homestays/fallback/unit-fallback.jpg\')">' +
              '<span class="badge badge-olive">' + m.score_pct + '% phù hợp</span></div>' +
              '<div class="card-body">' +
              '<h3 class="card-title">' + UI.esc(u.name) + '</h3>' +
              '<div class="card-loc">' + UI.icon('map') + UI.esc((u.property && u.property.district) || 'Hà Nội') + ', Hà Nội</div>' +
              '<div class="card-rating">' + (u.review_count > 0 ? '★ ' + (Number(u.avg_rating) || 0).toFixed(1) + ' (' + u.review_count + ')' : 'Chưa có đánh giá') + '</div>' +
              (reasons ? '<ul class="reason-list">' + reasons + '</ul>' : '') +
              '<div class="card-footer"><div class="card-price"><b>' + UI.formatVND(u.base_price) + '</b><span>/ đêm</span></div>' +
              '<a class="btn btn-outline" href="unit-detail.html?id=' + u.id + '">Xem chi tiết</a></div>' +
              '</div></article>';
          }).join('') + '</div>' +
          '<div class="text-center mt-6"><button type="button" class="btn btn-ghost" onclick="location.reload()">← Làm lại quiz</button></div>';
      }

      showStep(1);
    })();
  </script>
</body>
</html>
