<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn đặt của tôi - YangHomestay</title>
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#1F2923">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <section class="section-tight">
    <div class="container">
      <div class="breadcrumb"><a href="./">Trang chủ</a> / Đơn đặt của tôi</div>
      <h1>Đơn đặt của tôi</h1>
      <div class="tabs" id="tabs">
        <button type="button" class="tab active" data-status="">Tất cả</button>
        <button type="button" class="tab" data-status="pending">Chờ xác nhận</button>
        <button type="button" class="tab" data-status="confirmed">Sắp tới</button>
        <button type="button" class="tab" data-status="checkin">Đang ở</button>
        <button type="button" class="tab" data-status="checkout">Đã hoàn thành</button>
        <button type="button" class="tab" data-status="cancelled">Đã hủy</button>
      </div>
      <div id="list"></div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      'use strict';
      var UI = window.YangUI;
      UI.injectHeader();
      UI.injectFooter();

      var currentStatus = '';

      function load() {
        var box = document.getElementById('list');
        box.innerHTML = '<div class="state-box"><div class="skeleton" style="height:80px;max-width:600px;margin:0 auto"></div></div>';
        window.YangAPI.get('my-bookings', currentStatus ? { status: currentStatus } : null).then(function (j) {
          if (j._status === 401) { location.href = 'login.html?next=bookings.html'; return; }
          if (!j.success) { box.innerHTML = '<div class="state-box"><h3>' + UI.esc(j.message || 'Không thể tải đơn đặt') + '</h3><p>Vui lòng thử lại sau ít phút.</p><button type="button" class="btn btn-primary" id="retry-bookings">Thử lại</button></div>'; document.getElementById('retry-bookings').addEventListener('click', load); return; }
          var list = j.data || [];
          if (!list.length) {
            box.innerHTML = '<div class="state-box"><span class="emoji">🧳</span><h3>Chưa có đơn đặt nào</h3><p>Khám phá homestay và bắt đầu chuyến đi của bạn.</p><a class="btn btn-primary" href="homestays.html">Tìm homestay</a></div>';
            return;
          }
          box.innerHTML = list.map(function (b) {
            var img = b.unit && b.unit.cover_image && b.unit.cover_image.image_url
              ? window.assetUrl(b.unit.cover_image.image_url)
              : window.assetUrl('assets/images/homestays/fallback/unit-fallback.jpg');
            var name = b.unit && b.unit.name ? b.unit.name : 'Homestay';
            var prop = b.unit && b.unit.property && b.unit.property.name ? b.unit.property.name : '';
            var actions = '';
            if (['pending', 'confirmed'].indexOf(b.status) !== -1) {
              actions += '<button type="button" class="btn btn-outline" data-act="cancel" data-id="' + b.id + '">Hủy</button>';
            }
            if (b.status === 'checkout') {
              actions += '<a class="btn btn-olive" href="review.html?booking_id=' + b.id + '">Đánh giá</a>';
            }
            actions += '<a class="btn btn-primary" href="booking-detail.html?id=' + b.id + '">Chi tiết</a>';
            return '<div class="booking-row">' +
              '<img src="' + UI.esc(img) + '" alt="' + UI.esc(name) + '" loading="lazy" onerror="this.src=window.assetUrl(\'assets/images/homestays/fallback/unit-fallback.jpg\')">' +
              '<div class="booking-meta">' +
              '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
              '<b>' + UI.esc(name) + '</b>' +
              '<span class="status-pill status-' + b.status + '">' + UI.statusLabel(b.status) + '</span>' +
              '<span class="' + (b.payment_status === 'paid' ? 'pay-paid' : 'pay-unpaid') + '">' + UI.payLabel(b.payment_status) + '</span>' +
              '</div>' +
              '<p><b>Mã đặt:</b> ' + UI.esc(b.booking_reference || '') + '</p>' +
              '<p><b>Lưu trú:</b> ' + UI.fmtDate(b.check_in) + ' → ' + UI.fmtDate(b.check_out) + ' · ' + b.number_of_nights + ' đêm · ' + b.total_guests + ' khách</p>' +
              (prop ? '<p><b>Homestay:</b> ' + UI.esc(prop) + '</p>' : '') +
              '<p><b style="color:var(--earth-dark)">' + UI.formatVND(b.total_amount) + '</b></p>' +
              '</div>' +
              '<div style="display:flex;flex-direction:column;gap:8px">' + actions + '</div>' +
              '</div>';
          }).join('');
          box.querySelectorAll('[data-act="cancel"]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var id = btn.getAttribute('data-id');
              if (!confirm('Bạn chắc chắn muốn hủy đơn đặt này? Đơn đã hủy không thể tự khôi phục trên website.')) return;
              window.YangAPI.post('cancel-booking', { id: Number(id) }).then(function (j) {
                if (j.success) { UI.toast(j.message || 'Đã hủy', 'success'); load(); }
                else UI.handleError(j);
              });
            });
          });
        }).catch(function () {
          box.innerHTML = '<div class="state-box"><h3>Không kết nối được máy chủ</h3><p>Kiểm tra kết nối rồi thử lại.</p><button type="button" class="btn btn-primary" id="retry-bookings">Thử lại</button></div>'; document.getElementById('retry-bookings').addEventListener('click', load);
        });
      }

      document.querySelectorAll('#tabs .tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          document.querySelectorAll('#tabs .tab').forEach(function (t) { t.classList.remove('active'); });
          tab.classList.add('active');
          currentStatus = tab.getAttribute('data-status');
          load();
        });
      });

      UI.checkAuth().then(function (c) {
        if (!c) { location.href = 'login.html?next=bookings.html'; return; }
        load();
      });
    })();
  </script>
</body>
</html>
