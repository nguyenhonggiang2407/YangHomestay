<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - YangHomestay</title>
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#1F2923">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <section class="section">
    <div class="container">
      <div class="auth-wrap">
        <div class="auth-media">
          <img src="../assets/images/homestays/west-lake-workcation-loft/cover.jpg" alt="Một góc Hà Nội hiện đại" loading="lazy" onerror="this.onerror=null;this.src='../assets/images/homestays/fallback/unit-fallback.jpg'">
          <div class="auth-quote">Tìm căn homestay hợp gu giữa lòng Hà Nội.</div>
        </div>
      <div class="form-card">
        <div class="text-center" style="margin-bottom:22px">
          <span class="brand-mark" style="margin:0 auto 10px">Y</span>
          <h2 style="margin-bottom:4px">Tạo tài khoản YangHomestay</h2>
          <p style="color:var(--earth-light);font-size:14px">Chỉ cần vài thông tin cơ bản để bắt đầu đặt homestay.</p>
        </div>
        <form id="reg-form" novalidate>
          <div class="form-group" id="g-full_name">
            <label for="full_name">Họ tên</label>
            <input type="text" id="full_name" autocomplete="name" required>
            <div class="form-error" id="e-full_name"></div>
          </div>
          <div class="form-group" id="g-email">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" required>
            <div class="form-error" id="e-email"></div>
          </div>
          <div class="form-group" id="g-phone">
            <label for="phone">Số điện thoại</label>
            <input type="tel" id="phone" autocomplete="tel" placeholder="VD: 0912345678" required>
            <div class="form-error" id="e-phone"></div>
          </div>
          <div class="form-group" id="g-password">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" autocomplete="new-password" minlength="8" required>
            <div class="form-hint">Tối thiểu 6 ký tự.</div>
            <div class="form-error" id="e-password"></div>
          </div>
          <div class="form-group" id="g-confirm_password">
            <label for="confirm_password">Xác nhận mật khẩu</label>
            <input type="password" id="confirm_password" autocomplete="new-password" required>
            <div class="form-error" id="e-confirm_password"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn">Đăng ký</button>
        </form>
        <p class="auth-alt">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
      </div>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      'use strict';
      var UI = window.YangUI;
      UI.injectHeader();
      UI.injectFooter();

      document.getElementById('reg-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('btn');
        btn.disabled = true; btn.textContent = 'Đang tạo tài khoản…';
        window.YangAPI.post('register', {
          full_name: document.getElementById('full_name').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          password: document.getElementById('password').value,
          confirm_password: document.getElementById('confirm_password').value
        }).then(function (j) {
          if (j.success) {
            UI.toast(j.message || 'Đăng ký thành công', 'success');
            setTimeout(function () { location.href = 'login.html'; }, 800);
          } else {
            btn.disabled = false; btn.textContent = 'Đăng ký';
            UI.handleError(j);
            document.querySelectorAll('.form-group').forEach(function (g) { g.classList.remove('has-error'); });
            if (j.errors) {
              Object.keys(j.errors).forEach(function (k) {
                var g = document.getElementById('g-' + k);
                var err = document.getElementById('e-' + k);
                if (g && err) { g.classList.add('has-error'); err.textContent = j.errors[k]; }
              });
            }
          }
        }).catch(function () {
          btn.disabled = false; btn.textContent = 'Đăng ký';
          UI.toast('Không kết nối được máy chủ', 'error');
        });
      });
    })();
  </script>
</body>
</html>
