spring.application.name=YangHomestay Booking
server.address=${YANGHOMESTAY_BIND:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.cookie.name=YANGHOMESTAY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${YANGHOMESTAY_SECURE_COOKIE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${YANGHOMESTAY_DB_URL:jdbc:postgresql://127.0.0.1:55432/yanghomestay}
spring.datasource.username=${YANGHOMESTAY_DB_USER:yanghomestay}
spring.datasource.password=${YANGHOMESTAY_DB_PASSWORD:yanghomestay_demo_local}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Ho_Chi_Minh'
spring.datasource.hikari.maximum-pool-size=8
